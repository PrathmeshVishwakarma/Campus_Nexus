services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: campus_nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://nexus:nexus@db:5432/campus_nexus
      # set in ./.env (see .env.example); if empty a key is generated and kept in the data volume
      SECRET_KEY: ${SECRET_KEY:-}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      SHARED_FOLDER: /app/shared/demo_files
      DATA_DIR: /app/data
    volumes:
      - "./shared:/app/shared"
      - "nexusdata:/app/data"
    depends_on:
      db:
        condition: service_healthy
    # one worker: the anomaly detector and live sockets keep per-process state
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  pgdata:
  nexusdata:
