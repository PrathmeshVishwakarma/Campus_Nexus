services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: campus_nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://nexus:nexus@db:5432/campus_nexus
    volumes: ["./shared:/app/shared"]
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  pgdata:
